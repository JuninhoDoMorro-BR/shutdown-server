name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install flask pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole shutdown_server.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: shutdown-exe
        path: dist/shutdown_server.exe
